name: Eval gate

on:
    pull_request:
        branches: [main]

env:
    FAITHFULNESS_THRESHOLD: '0.75'
    RELEVANCE_THRESHOLD: '0.70'

jobs:
    eval:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Install project
              run: pip install -e .

            - name: Start Chroma
              run: docker compose up chroma -d

            - name: Wait for Chroma
              run: |
                  for i in {1..10}; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/api/v2/heartbeat)
                    if [ "$STATUS" = "200" ]; then
                      echo "Chroma is ready"
                      break
                    fi
                    echo "Waiting for Chroma... ($i/10)"
                    sleep 3
                  done

            - name: Run evals
              env:
                  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                  LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
                  LANGCHAIN_TRACING_V2: 'false'
                  FAITHFULNESS_THRESHOLD: ${{ env.FAITHFULNESS_THRESHOLD }}
                  RELEVANCE_THRESHOLD: ${{ env.RELEVANCE_THRESHOLD }}
              run: |
                  pytest evals/ -v --ignore=evals/dataset \
                    -p no:warnings \
                    --co -q 2>/dev/null | grep "test session starts" || true
                  pytest evals/ -v --ignore=evals/dataset \
                    -p no:warnings \
                    -k "test_" \
                    --ignore-glob="*/__init__.py" \
                    2>&1 | tee eval_results.txt
                  # Exit 0 if no tests yet (placeholders), fail only on actual test failures
                  EXIT=${PIPESTATUS[0]}
                  if [ "$EXIT" = "5" ]; then
                    echo "No eval tests implemented yet — skipping gate"
                    exit 0
                  fi
                  exit $EXIT
