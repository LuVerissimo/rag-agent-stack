services:
    chroma:
        image: chromadb/chroma:latest
        ports:
            - '8001:8000'
        volumes:
            - chroma-data:/chroma/chroma
        environment:
            - ALLOW_RESET=true

    api:
        build: .
        ports:
            - '8000:8000'
        env_file:
            - .env
        depends_on:
            - chroma
        environment:
            - CHROMA_HOST=chroma
            - CHROMA_PORT=8000
        volumes:
            - ./:/app

volumes:
    chroma-data:
